name: Bug report
description: 报告程序问题
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请使用不含私人素材的最小示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 与程序版本

